name: iOS Build

concurrency:
  group: ios-build
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the IPA to GitHub Releases
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild -project MagicRule.xcodeproj \
            -scheme MagicRule \
            -configuration Release \
            -archivePath build/MagicRule.xcarchive \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/MagicRule.xcarchive/Products/Applications/MagicRule.app Payload/
          zip -r magicrule-ios-unsigned.ipa Payload
          unzip -l magicrule-ios-unsigned.ipa | head -30

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicrule-ios-unsigned
          path: magicrule-ios-unsigned.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="unsigned-${{ github.run_number }}"
          gh release create "$TAG" --title "Unsigned IPA #${{ github.run_number }}" \
            --notes "Unsigned IPA built from commit ${{ github.sha }}. Sign it before installing." \
            magicrule-ios-unsigned.ipa
